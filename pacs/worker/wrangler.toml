name = "vibepacs-log"
main = "worker.js"
compatibility_date = "2026-01-01"

[[kv_namespaces]]
binding = "RESULTS"
# id aus `wrangler kv namespace create RESULTS` hier eintragen
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
# Weitere erlaubte Adressen der Seite (durch Komma getrennt), z. B. nach einem Umzug in ein eigenes Repository
EXTRA_ORIGINS = ""
